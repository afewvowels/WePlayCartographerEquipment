[technology-name]
wp-cartographer-equipment=Cartographer equipment

[technology-description]
wp-cartographer-equipment=Personal radar equipment that charts the area around you as you explore.

[mod-setting-name]
wp-cartographer-power=Power draw (kW)
wp-cartographer-interval=Scan interval (ticks)
wp-cartographer-radius=Charting radius (tiles)
wp-cartographer-quality-bonus=Radius bonus per quality level (%)
wp-cartographer-generate=Generate unexplored chunks

[mod-setting-description]
wp-cartographer-power=Average power the equipment uses while scanning. It charges from your grid like a battery and spends a chunk of energy each scan.
wp-cartographer-interval=How often the equipment charts the area around you (60 ticks = 1 second).
wp-cartographer-radius=How far around you is charted, in tiles. The default 256 tiles is 8 chunks in each direction, well past what your character can see on its own.
wp-cartographer-quality-bonus=Extra radius for each quality level. At 25%, an uncommon unit charts 25% farther and a legendary one 125% farther.
wp-cartographer-generate=Ask the map to generate chunks inside the charting area that don't exist yet, so the equipment reveals new territory like a real radar. Turn off to only chart areas that already exist.
